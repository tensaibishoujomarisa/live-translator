# ============================================================
#  火羽ひのめ · 直播间常出现的词（补充）
# ------------------------------------------------------------
#  来源：她的 B 站「直播回放」合集（series 220248，283 个投稿）
#  里的真实标题，以及直播间公开资料（room 22748536）。
#
#  挑选标准：在她的标题里**反复出现**、或者属于她固定内容的词。
#  只出现过一次的新闻性说法没有收录。
#
#  导入方式：
#    python -m backend.main --import-terms terms_hinome_live.draft.yaml
#
#  【说明】回放标题能看到的时间跨度是 2021~2023；
#  她现在的直播标题仍然是「【B限】ひの雑！！」，
#  说明节目形式和这些主题一直在延续。
#  但**最新的梗（2026 年的）我拿不到** —— B 站会风控，
#  动态接口 404、视频列表接口限流。这部分还是要你补充。
# ============================================================

entries:

  # ----------------------------------------------------------
  # A. 她的固定节目 / 直播形式（出现频率最高）
  # ----------------------------------------------------------
  - ja: ひの雑
    zh: 火羽杂谈
    note: 她的固定节目名，ひのめ + 雑談 的合成。标题里几乎每天都有
    alt: [ひのぞう, HinoZatsu]

  - ja: B限
    zh: B站限定
    note: 只在 B 站播的意思（对日本观众而言是"限定平台"）

  - ja: 雑談
    zh: 杂谈

  - ja: 延長戦
    zh: 加时（直播延长）

  - ja: 個人勢
    zh: 个人势
    note: 她自述「个人势」，即不属于任何事务所

  - ja: 新衣装
    zh: 新衣服
    note: 她的标题里有「新衣装！！！」这样的直播

  # ----------------------------------------------------------
  # B. ちいかわ —— 她最常聊的东西（60 个标题里出现 10+ 次）
  #    「ちいかわ更新まだ？」「ちいかわ大行列！」
  #    「燃えるちいかわ神輿」「ちいかわ1億回」…
  # ----------------------------------------------------------
  - ja: ちいかわ
    zh: 吉伊卡哇
    note: 她反复聊的漫画/动画，标题里出现频率最高
    alt: [Chiikawa, 小可爱, 吉伊卡哇]

  - ja: ハチワレ
    zh: 小八
    note: 吉伊卡哇里的角色（八字眉那只）
    alt: [Hachiware, 哈奇瓦雷]

  # ----------------------------------------------------------
  # C. 游戏 / 她固定会玩的
  #    她的简介写着：FF14配信は????が消えるまで引退
  #    （FF14 直播在 ???? 消失之前停播）
  # ----------------------------------------------------------
  - ja: FF14
    zh: FF14
    note: 最终幻想 14。她简介里提到过
    alt: [FFXIV, ファイナルファンタジー14, ファイナルファンタジーXIV]

  - ja: ポケカ
    zh: 宝可梦卡牌
    note: ポケモンカード 的简称。「ポケカ大行列！」这类标题
    alt: [ポケモンカード, Pokemon Card]

  - ja: ポケモン
    zh: 宝可梦
    alt: [Pokemon, ポケットモンスター]

  - ja: モンハンGO
    zh: 怪物猎人 Now
    note: モンスターハンターNow
    alt: [モンハン, モンスターハンター, Monster Hunter Now]

  # ----------------------------------------------------------
  # D. 她聊过的具体东西（标题里出现过，属于她的兴趣范围）
  #    这些不是"必现"，但听到时按这个译法能对上中文习惯
  # ----------------------------------------------------------
  - ja: 大谷翔平
    zh: 大谷翔平
    note: 棒球选手，标题里有「大谷翔平！」

  - ja: ヒカキン
    zh: Hikakin
    note: 日本知名 YouTuber

  - ja: みそきん
    zh: 味噌金
    note: Hikakin 出的杯面。标题「みそきん！！」
    alt: [ミソキン, 味噌金]

  - ja: 超会議
    zh: 超会议
    note: ニコニコ超会議
    alt: [ニコニコ超会議, 超會議]

  - ja: 銀河鉄道
    zh: 银河铁道
    note: 标题「銀河鉄道ってこと？！」
    alt: [銀河鉄道999]

  # ----------------------------------------------------------
  # E. 她的地理背景（标题里反复出现大阪/关西地名）
  #    「淀ちゃん！」「淀川スイミング！」「茨城県！」
  # ----------------------------------------------------------
  - ja: 淀川
    zh: 淀川
    note: 大阪的河。标题里叫「淀ちゃん」

  - ja: づぼらや
    zh: づぼらや
    note: 大阪著名的河豚料理店，标题里出现过

  - ja: 茨城県
    zh: 茨城县

  # ----------------------------------------------------------
  # F. 日本的时节（她的标题会跟着节日走，几乎每月都有）
  # ----------------------------------------------------------
  - ja: 節分
    zh: 节分
    note: 2 月 3 日前后撒豆驱鬼的日子

  - ja: 立春
    zh: 立春

  - ja: 春節
    zh: 春节

  - ja: 元宵節
    zh: 元宵节

  - ja: 鏡開き
    zh: 镜开
    note: 1 月 11 日左右开镜饼的习俗

  - ja: 大晦日
    zh: 除夕

  - ja: 初詣
    zh: 新年参拜
    note: 元旦去神社参拜

  - ja: GW
    zh: 黄金周
    note: ゴールデンウィーク。标题里「GW初日」「GW開幕」
    alt: [ゴールデンウィーク, Golden Week]

  # ----------------------------------------------------------
  # G. ★★ 2026 年最新的梗 —— 我拿不到 ★★
  #
  #  试过的办法和结果：
  #    - B 站空间页 / 搜索页 → 要验证码
  #    - 视频列表 API      → 412 / -799 限流
  #    - 动态 API          → 404
  #    - 知乎 / NGA / 搜狐  → 域名解析到内网 IP，取不到
  #
  #  以上 A~F 是从**回放标题和公开资料**里能确证的。
  #  如果你最近看直播听到新的口头禅，按这个格式加：
  #
  # - ja: （她说的日语）
  #   zh: （中文）
  #   note: （什么梗）
  # ----------------------------------------------------------
