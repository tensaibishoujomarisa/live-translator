# ============================================================
#  补漏：本地翻译实测暴露的高频缺口
# ------------------------------------------------------------
#  实测句子（本地 Marian 模型）：
#    みんなおはよう！今日も配信始めるよ
#      → 大家早上好,今天开始配信吧!        ← 配信 没翻出来
#    また明日も配信するからね
#      → 我明天还会送货的。                ← 配信 被译成"送货"
#    ポケカの大会行ってきたんだけどさ
#      → 我们去了Pokeca的会议。            ← Pokeca 没翻，大会→会议
#    そのゲームもうクリアした？
#      → 这个游戏已经清理了吗?             ← クリア→清理
#
#  这里补的就是这些**每天都会遇到**的词。
#  （alt 里的内容会被 Glossary.apply 直接替换，
#    所以本地 NMT 也能吃到一部分术语表的效果）
# ============================================================

entries:

  # ---- 直播本身 ----
  - ja: 配信
    zh: 直播
    note: 最高频的词。本地模型常留原文或误译成"送货"
    alt: [配信]

  - ja: 生放送
    zh: 直播

  - ja: 枠
    zh: 场（直播场次）
    note: 歌枠/雑談枠 里的那个"枠"

  - ja: 待機
    zh: 等待开场

  - ja: 告知
    zh: 通知／预告

  - ja: アーカイブ
    zh: 回放
    alt: [Archive, 存档]

  - ja: コラボ
    zh: 联动
    alt: [Collab, Collaborations]

  # ---- 游戏（她直播常玩） ----
  - ja: クリア
    zh: 通关
    note: 实测被误译成"清理"

  - ja: 大会
    zh: 大赛
    note: 实测被误译成"会议"

  # ポケカ / ちいかわ 已经在术语表里了（terms_hinome_live 导入过），
  # 这里不重复添加 —— 它们的 alt（模型常见的音译写法）直接在 glossary.yaml 里补。
