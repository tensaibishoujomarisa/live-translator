# ============================================================
#  火羽ひのめ · 术语表候选
# ------------------------------------------------------------
#  【怎么用】
#  1. 打开这个文件，把不要的行删掉
#  2. 用记事本打开 G:\agent\jp-live-translator\glossary.yaml
#  3. 把下面 entries: 之后的**缩进内容**整段粘到 glossary.yaml 的
#     `entries:` 下面（注意保持每行前面 2 个空格的缩进，别粘到文件最开头）
#  4. 保存，然后重启字幕程序（术语表是启动时读的）
#
#  【重要】标了 "★ 待你确认" 的，是我**没有可靠来源**、
#  不能替你确定的东西。请按你实际听到的改掉或删掉。
#  宁可少几条，也不要塞错 —— 错了会污染她说的每一句话。
# ============================================================

entries:

  # ----------------------------------------------------------
  #  A. 姓名（这几条我有把握）
  #     「ひのめ」的常规读法就是 hinome，汉字常写作「日の目」
  #     （意思是「阳光 / 出头之日」）。
  #     日语人名写法很自由，如果她自己公布过汉字写法，
  #     以她公布的为准，改 zh 就行。
  # ----------------------------------------------------------
  - ja: 火羽ひのめ
    zh: 火羽ひのめ
    note: 主播本人名字，中文圈也直接写日文名，不要意译
    alt: [火羽, ひのめ, ヒノメ, Hinome, hinome]

  - ja: 火羽
    zh: 火羽
    note: 念观众ID/自我介绍时单独出现，不要意译成"火之羽"之类

  - ja: ひのめ
    zh: 火羽
    note: 简称。她自称或观众叫她时用

  # ----------------------------------------------------------
  #  B. 称呼（★ 待你确认 —— 我不确定她确切的粉丝名和昵称）
  #     如果她称呼观众是别的词（比如「ひのめす」「火羽ちゃん」），
  #     请直接改 ja，并把 zh 改成相应中文。
  # ----------------------------------------------------------
  - ja: ひのめちゃん
    zh: 火羽酱

  - ja: 火羽ちゃん
    zh: 火羽酱

  # ----------------------------------------------------------
  #  C. 她直播间常见的直播用语
  #     ★ 待你确认 —— 我搜到一条切片标题写着
  #     「日V中气十足的念观众id」，说明「念观众ID」是她直播的
  #     一个特点，所以下面几条应该会遇到。
  # ----------------------------------------------------------
  - ja: 名前を呼ぶ
    zh: 念名字
    note: 念观众ID 的习惯

  - ja: コメント
    zh: 弹幕
    note: 日语「コメント」在这类直播间就是指弹幕

  - ja: SC
    zh: SC
    note: Super Chat。日V圈直接说 SC，不用翻译成"超级留言"

  # スパチャ 你的 glossary.yaml 里已经有了（SC（打赏）），
  # 这里注释掉，免得覆盖掉那个更好的版本。要改就去改原文件。
  # - ja: スパチャ
  #   zh: SC

  - ja: ギフト
    zh: 礼物

  - ja: 艦長
    zh: 舰长

  - ja: 提督
    zh: 提督

  - ja: 総督
    zh: 总督

  # ----------------------------------------------------------
  #  D. ★★ 最新的梗 —— 这一节我**完全填不了** ★★
  #
  #     原因是实打实的：B站空间页要验证码、搜索API返回412、
  #     知乎/NGA/搜狐的 IP 取不到。我只搜到围绕她的**事件评论**
  #     （真白花音事件、被风波流量选中、质疑"造神"等），
  #     那些是论坛话题，不一定是她直播间的固定梗。
  #
  #     请你照下面格式补。判断标准很简单：
  #       ★ 她反复说的词 / 观众反复刷的词 → 该进
  #       ✗ 只出现过一次的新闻性说法   → 别进
